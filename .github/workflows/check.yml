name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Ruff
        run: |
          pip install --quiet ruff
          ruff check scripts/load_skill.py
      - name: Tests and generated-file drift check
        run: make check
