name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Build archives
        run: |
          mkdir dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=""
              if [ "$os" = "windows" ]; then ext=".exe"; fi
              target="stack_${GITHUB_REF_NAME}_${os}_${arch}"
              mkdir -p "$target"
              GOOS="$os" GOARCH="$arch" go build -ldflags "-s -w" -o "$target/stack$ext" ./cmd/stack
              cp -R AGENTS.md VERSION .ai scripts "$target/"
              tar -czf "dist/$target.tar.gz" "$target"
            done
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
